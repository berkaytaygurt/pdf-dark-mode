<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dark Mode PDF | Read Documents Without Eye Strain</title>

    <link rel="icon" type="image/png" href="/icon1.png" sizes="any">
    <link rel="apple-touch-icon" href="/icon1.png">

    <meta name="description" content="Convert any PDF to dark mode instantly. Protect your eyes, read comfortably at night with our free online dark mode PDF converter.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>

    <style>
        :root {
            --primary: #00f2ff;
            --secondary: #bd00ff;
            --bg: #0a0a0f;
            --card-bg: rgba(20, 20, 28, 0.97);
            --text: #f0f0f0;
            --text-muted: #888;
            --gold: #ffd700;
            --border: rgba(255, 255, 255, 0.08);
            --font-display: 'Syne', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
        }

        body {
            background-color: var(--bg);
            background-image:
                radial-gradient(ellipse 80% 50% at 20% -10%, rgba(0, 242, 255, 0.07) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 80% 100%, rgba(189, 0, 255, 0.06) 0%, transparent 60%),
                linear-gradient(180deg, #0a0a0f 0%, #0f0f1a 100%);
            color: var(--text);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── HEADER ── */
        .site-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            width: 100%;
        }

        .logo {
            font-family: var(--font-display);
            font-size: 1rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 9px;
            letter-spacing: -0.02em;
            white-space: nowrap;
        }

        .logo-icon {
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, #00f2ff, #bd00ff);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            flex-shrink: 0;
        }

        .lang-switch {
            display: flex;
            gap: 3px;
            background: rgba(255,255,255,0.05);
            padding: 4px;
            border-radius: 20px;
            flex-shrink: 0;
        }

        .lang-btn {
            background: transparent;
            border: none;
            color: #666;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.72rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s;
            font-family: var(--font-body);
            letter-spacing: 0.05em;
        }

        .lang-btn.active {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 10px rgba(0,242,255,0.35);
        }

        /* ── MAIN LAYOUT ── */
        .page-wrapper {
            flex: 1;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 24px 16px 40px;
        }

        /* ── APP CARD ── */
        .container {
            width: 100%;
            max-width: 560px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 24px 20px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.04);
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
        }

        h1 {
            font-family: var(--font-display);
            font-size: clamp(1.5rem, 5vw, 2rem);
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #aaaaaa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.03em;
            line-height: 1.1;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.85em;
            font-weight: 300;
        }

        /* ── VIP ── */
        .vip-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .vip-btn {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.12);
            color: #aaa;
            padding: 10px 22px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            font-family: var(--font-body);
            touch-action: manipulation;
        }

        .vip-btn:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.2); }

        .vip-btn.active {
            background: linear-gradient(45deg, var(--gold), #ffaa00);
            color: #000;
            border: none;
            font-weight: 700;
            transform: scale(1.04);
            box-shadow: 0 4px 20px rgba(255,215,0,0.3);
        }

        .vip-benefits { font-size: 0.75rem; color: #777; line-height: 1.4; }
        .vip-benefits.hidden { display: none; }

        /* ── DROP ZONE ── */
        .drop-zone {
            border: 2px dashed rgba(255,255,255,0.12);
            border-radius: 16px;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.015);
            cursor: pointer;
            transition: all 0.3s;
            gap: 6px;
            padding: 18px 12px;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .drop-zone:hover,
        .drop-zone:active,
        .drop-zone.dragover {
            border-color: var(--primary);
            background: rgba(0,242,255,0.04);
            box-shadow: 0 0 20px rgba(0,242,255,0.08);
        }

        .drop-zone i {
            font-size: 26px;
            color: #444;
            transition: color 0.3s;
            pointer-events: none;
        }

        .drop-zone:hover i,
        .drop-zone:active i { color: var(--primary); }

        .drop-zone span {
            font-size: 0.82rem;
            color: #555;
            pointer-events: none;
        }

        .file-info {
            display: none;
            color: var(--primary);
            font-weight: 600;
            font-size: 0.8rem;
            word-break: break-all;
            pointer-events: none;
        }

        #fileInput { display: none; }

        /* ── FILTER GRID ── */
        #filter-grid {
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
        }

        .filter-card {
            background: rgba(255,255,255,0.025);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.25s;
            position: relative;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .filter-card:hover,
        .filter-card:active {
            transform: translateY(-3px);
            border-color: var(--primary);
            box-shadow: 0 8px 24px rgba(0,242,255,0.12);
        }

        .filter-card canvas {
            width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
        }

        .filter-name {
            margin-top: 7px;
            font-size: 0.78rem;
            font-weight: 600;
            color: #ccc;
            font-family: var(--font-display);
        }

        .card-loader {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            border-radius: 14px;
        }

        .spinner-small {
            width: 22px; height: 22px;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 0.8s linear infinite;
        }

        #status {
            font-size: 0.85em;
            color: #555;
            min-height: 1.3em;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── MODAL ── */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 20px;
        }

        .modal-content {
            background: #14141e;
            border: 1px solid #2a2a3a;
            padding: 28px 24px;
            border-radius: 22px;
            text-align: center;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 0 60px rgba(0,0,0,0.8);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-title {
            font-size: 1.3rem;
            color: #fff;
            margin-bottom: 16px;
            font-weight: 800;
            font-family: var(--font-display);
        }

        .btn-action {
            background: var(--gold);
            color: #000;
            border: none;
            padding: 13px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            font-size: 1rem;
            font-family: var(--font-display);
            touch-action: manipulation;
        }

        .btn-action:active { transform: scale(0.97); }

        .ad-video-mockup {
            height: 160px;
            background: #0a0a0a;
            border: 1px solid #222;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 18px;
            color: #444;
            border-radius: 12px;
            flex-direction: column;
            gap: 10px;
        }

        #ad-timer {
            font-size: 2rem;
            color: #fff;
            font-weight: 800;
            margin-bottom: 12px;
            font-family: var(--font-display);
        }

        @keyframes popIn {
            from { transform: scale(0.85); opacity: 0; }
            to   { transform: scale(1);    opacity: 1; }
        }

        /* ── FOOTER ── */
        .site-footer {
            text-align: center;
            padding: 20px 16px;
            background: rgba(0,0,0,0.5);
            color: #444;
            font-size: 0.78rem;
            border-top: 1px solid #1a1a1a;
        }

        .site-footer a {
            color: var(--primary);
            text-decoration: none;
            margin: 0 8px;
        }

        .site-footer a:hover { text-decoration: underline; }

        /* ── MOBILE TWEAKS ── */
        @media (max-width: 400px) {
            .container { padding: 20px 14px; border-radius: 18px; }
            .filter-name { font-size: 0.72rem; }
        }

        @media (hover: none) {
            /* Touch devices: disable hover transforms to avoid sticky states */
            .filter-card:hover { transform: none; }
            .vip-btn:hover { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.12); }
        }
    </style>
</head>
<body>

<!-- HEADER -->
<header class="site-header">
    <div class="logo">
        <div class="logo-icon"><i class="fa-solid fa-moon" style="color:#000;"></i></div>
        Dark Mode PDF
    </div>
    <div class="lang-switch">
        <button class="lang-btn" onclick="setLanguage('tr')" id="btn-tr">TR</button>
        <button class="lang-btn active" onclick="setLanguage('en')" id="btn-en">EN</button>
    </div>
</header>

<!-- PAGE WRAPPER -->
<div class="page-wrapper">
    <div class="container">
        <div>
            <h1 id="txt-title">Dark Mode PDF</h1>
            <p class="subtitle" id="txt-subtitle">Advanced Reading Mode — 4 Themes</p>
        </div>

        <div class="vip-area">
            <button id="vip-btn" class="vip-btn" onclick="handleVipClick()">
                <i class="fa-solid fa-crown"></i>
                <span id="txt-vip">VIP Mode (Watch 1 Ad)</span>
            </button>
            <div id="vip-benefits" class="vip-benefits">
                <i class="fa-solid fa-ban"></i> Ad-Free &nbsp;·&nbsp;
                <i class="fa-solid fa-layer-group"></i> Up to 5 Files at Once
            </div>
        </div>

        <label for="fileInput" class="drop-zone" id="dropZone">
            <i class="fa-solid fa-cloud-arrow-up"></i>
            <span id="dropText">Drop or click to select a PDF file</span>
            <div class="file-info" id="fileInfo"></div>
        </label>
        <input type="file" id="fileInput" accept="application/pdf">

        <div id="filter-grid">
            <div class="filter-card" onclick="onFilterClick('dark')">
                <div class="card-loader" id="loader-dark"><div class="spinner-small"></div></div>
                <canvas id="canvas-preview-dark"></canvas>
                <div class="filter-name" id="txt-filter-dark">⚫ Dark (Invert)</div>
            </div>
            <div class="filter-card" onclick="onFilterClick('soft')">
                <div class="card-loader" id="loader-soft"><div class="spinner-small"></div></div>
                <canvas id="canvas-preview-soft"></canvas>
                <div class="filter-name" id="txt-filter-soft">🌑 Soft (Gray)</div>
            </div>
            <div class="filter-card" onclick="onFilterClick('sepia')">
                <div class="card-loader" id="loader-sepia"><div class="spinner-small"></div></div>
                <canvas id="canvas-preview-sepia"></canvas>
                <div class="filter-name" id="txt-filter-sepia">📜 Sepia (Book)</div>
            </div>
            <div class="filter-card" onclick="onFilterClick('dimmed')">
                <div class="card-loader" id="loader-dimmed"><div class="spinner-small"></div></div>
                <canvas id="canvas-preview-dimmed"></canvas>
                <div class="filter-name" id="txt-filter-dimmed">🕶️ Dimmed</div>
            </div>
        </div>

        <div id="status"></div>
    </div>
</div>

<!-- AD MODAL -->
<div id="rewardAdModal" class="modal">
    <div class="modal-content">
        <div class="modal-title" style="color: var(--gold);" id="txt-ad-title">Sponsored Ad</div>
        <div class="ad-video-mockup">
            <i class="fa-solid fa-play" style="font-size: 2rem;"></i>
            <span id="txt-ad-playing" style="font-size:0.85rem;">Ad is playing...</span>
        </div>
        <div id="ad-timer">3</div>
        <button id="btn-close-ad" class="btn-action" style="display: none;" onclick="closeAdAndReward()">
            Claim Reward &amp; Close
        </button>
    </div>
</div>

<!-- FOOTER -->
<footer class="site-footer">
    <div style="margin-bottom: 8px;">&copy; 2026 Dark Mode PDF. All rights reserved.</div>
    <div>
        <a href="#" id="link-privacy">Privacy Policy</a> |
        <a href="#" id="link-terms">Terms of Service</a> |
        <a href="#" id="link-contact">Contact</a>
    </div>
</footer>

<script>
    const translations = {
        tr: {
            title: "Dark Mode PDF",
            subtitle: "Gelişmiş Okuma Modu — 4 Tema",
            dropText: "PDF dosyasını seç veya buraya sürükle",
            dropTextMulti: "PDF Dosyalarını Seç (Çoklu)",
            statusReady: "Harika! Bir stil seçin:",
            statusSelect: "Lütfen önce dosya seçin!",
            statusVipOnly: "Çoklu dosya seçimi VIP modunda kullanılabilir!",
            statusProcessing: "Dönüştürülüyor...",
            statusGenerating: "Önizlemeler Yükleniyor...",
            statusComplete: "Tamamlandı!",
            vipText: "🎥 1 Reklam İzle → VIP Ol",
            vipActive: "✓ VIP Modu Aktif",
            vipBenefits: "Reklamsız &nbsp;·&nbsp; 5 Dosya Aynı Anda",
            filterDark: "⚫ Koyu (Ters)",
            filterSoft: "🌑 Yumuşak (Gri)",
            filterSepia: "📜 Sepia (Kitap)",
            filterDimmed: "🕶️ Loş Işık",
            adTitle: "Sponsorlu Reklam",
            adPlaying: "Reklam oynatılıyor...",
            adRewardBtn: "Ödülü Al & Kapat",
            linkPrivacy: "Gizlilik Politikası",
            linkTerms: "Kullanım Koşulları",
            linkContact: "İletişim"
        },
        en: {
            title: "Dark Mode PDF",
            subtitle: "Advanced Reading Mode — 4 Themes",
            dropText: "Drop or click to select a PDF file",
            dropTextMulti: "Select PDF Files (Multi)",
            statusReady: "Great! Now choose a style:",
            statusSelect: "Please select a file first!",
            statusVipOnly: "Multi-file upload requires VIP mode!",
            statusProcessing: "Converting...",
            statusGenerating: "Generating Previews...",
            statusComplete: "Conversion Complete!",
            vipText: "🎥 Watch 1 Ad → Get VIP",
            vipActive: "✓ VIP Mode Active",
            vipBenefits: "Ad-Free &nbsp;·&nbsp; Up to 5 Files at Once",
            filterDark: "⚫ Dark (Invert)",
            filterSoft: "🌑 Soft (Gray)",
            filterSepia: "📜 Sepia (Book)",
            filterDimmed: "🕶️ Dimmed",
            adTitle: "Sponsored Ad",
            adPlaying: "Ad is playing...",
            adRewardBtn: "Claim Reward & Close",
            linkPrivacy: "Privacy Policy",
            linkTerms: "Terms of Service",
            linkContact: "Contact"
        }
    };

    let currentLang = 'en';
    const dropZone   = document.getElementById('dropZone');
    const fileInput  = document.getElementById('fileInput');
    const fileInfo   = document.getElementById('fileInfo');
    const dropText   = document.getElementById('dropText');
    const status     = document.getElementById('status');
    const filterGrid = document.getElementById('filter-grid');
    const VIP_DURATION = 3 * 60 * 60 * 1000;

    const savedLang = localStorage.getItem('appLanguage');
    setLanguage(savedLang || 'en');
    checkVipStatus();

    // ── File input ──
    fileInput.addEventListener('change', function () {
        if (this.files.length > 0) handleFiles(this.files);
    });

    // ── Drag & drop ──
    ['dragenter','dragover','dragleave','drop'].forEach(ev => {
        dropZone.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); });
    });
    dropZone.addEventListener('dragover',  () => dropZone.classList.add('dragover'));
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', e => {
        dropZone.classList.remove('dragover');
        if (e.dataTransfer.files.length > 0) {
            fileInput.files = e.dataTransfer.files;
            handleFiles(e.dataTransfer.files);
        }
    });

    // ── Handle files ──
    async function handleFiles(files) {
        const t = translations[currentLang];
        dropText.style.display = 'none';
        dropZone.querySelector('i').className = 'fa-solid fa-file-pdf';
        dropZone.querySelector('i').style.color = 'var(--primary)';
        fileInfo.innerText = files.length > 1
            ? `${files.length} Files Selected`
            : files[0].name;
        fileInfo.style.display = 'block';
        filterGrid.style.display = 'grid';
        status.innerText = t.statusGenerating;
        status.style.color = '#888';

        ['dark','soft','sepia','dimmed'].forEach(m =>
            document.getElementById(`loader-${m}`).style.display = 'flex'
        );

        await Promise.all([
            generatePreviewForMode(files[0], 'dark',   'canvas-preview-dark',   'loader-dark'),
            generatePreviewForMode(files[0], 'soft',   'canvas-preview-soft',   'loader-soft'),
            generatePreviewForMode(files[0], 'sepia',  'canvas-preview-sepia',  'loader-sepia'),
            generatePreviewForMode(files[0], 'dimmed', 'canvas-preview-dimmed', 'loader-dimmed'),
        ]);

        status.innerText = t.statusReady;
        status.style.color = 'var(--primary)';
    }

    // ── Conversion ──
    async function startConversionProcess(mode) {
        const t = translations[currentLang];
        const files = fileInput.files;
        status.style.color = 'var(--gold)';
        for (let i = 0; i < files.length; i++) {
            status.innerText = files.length > 1
                ? `${t.statusProcessing} (${i+1}/${files.length})`
                : `${t.statusProcessing} (${mode.toUpperCase()})`;
            try { await processSingleFile(files[i], mode); } catch(err) { console.error(err); }
        }
        status.style.color = '#00e676';
        status.innerText = t.statusComplete;
    }

    async function processSingleFile(file, mode) {
        const arrayBuffer = await file.arrayBuffer();
        const originalPdf = await PDFLib.PDFDocument.load(arrayBuffer);
        const newPdf = await PDFLib.PDFDocument.create();
        const embeddedPages = await newPdf.embedPages(originalPdf.getPages());
        for (const embeddedPage of embeddedPages) {
            const { width, height } = embeddedPage.size();
            const newPage = newPdf.addPage([width, height]);
            drawModeLayer(newPage, width, height, mode, embeddedPage);
        }
        const pdfBytes = await newPdf.save();
        const blob = new Blob([pdfBytes], { type: 'application/pdf' });
        const cleanName = file.name.replace(/\.pdf$/i, '');
        const modeSuffix = mode.charAt(0).toUpperCase() + mode.slice(1);
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `DarkModePDF_${cleanName}_${modeSuffix}.pdf`;
        link.click();
    }

    async function generatePreviewForMode(file, mode, canvasId, loaderId) {
        try {
            const arrayBuffer = await file.arrayBuffer();
            const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer);
            const newPdf = await PDFLib.PDFDocument.create();
            const [embeddedPage] = await newPdf.embedPages([pdfDoc.getPages()[0]]);
            const { width, height } = embeddedPage.size();
            const newPage = newPdf.addPage([width, height]);
            drawModeLayer(newPage, width, height, mode, embeddedPage);
            const pdfBytes = await newPdf.save();
            const blob = new Blob([pdfBytes], { type: 'application/pdf' });
            await renderPageToCanvas(await blob.arrayBuffer(), canvasId);
            document.getElementById(loaderId).style.display = 'none';
        } catch(err) { console.error(err); }
    }

    function drawModeLayer(newPage, width, height, mode, embeddedPage) {
        newPage.drawRectangle({ x: 0, y: 0, width, height, color: PDFLib.rgb(1,1,1) });
        newPage.drawPage(embeddedPage, { x: 0, y: 0, width, height });
        if (mode === 'dark') {
            newPage.drawRectangle({ x:0, y:0, width, height, color: PDFLib.rgb(1,1,1), blendMode: PDFLib.BlendMode.Difference });
        } else if (mode === 'soft') {
            newPage.drawRectangle({ x:0, y:0, width, height, color: PDFLib.rgb(1,1,1), blendMode: PDFLib.BlendMode.Difference });
            newPage.drawRectangle({ x:0, y:0, width, height, color: PDFLib.rgb(0,0,0), opacity: 0.15 });
        } else if (mode === 'sepia') {
            newPage.drawRectangle({ x:0, y:0, width, height, color: PDFLib.rgb(0.82,0.76,0.60), blendMode: PDFLib.BlendMode.Multiply });
        } else if (mode === 'dimmed') {
            newPage.drawRectangle({ x:0, y:0, width, height, color: PDFLib.rgb(0,0,0), opacity: 0.5 });
        }
    }

    async function renderPageToCanvas(buffer, canvasId) {
        const loadingTask = pdfjsLib.getDocument(buffer);
        const pdf  = await loadingTask.promise;
        const page = await pdf.getPage(1);
        const canvas  = document.getElementById(canvasId);
        const context = canvas.getContext('2d');
        const desiredWidth = canvas.parentElement.clientWidth - 20;
        const scale = desiredWidth / page.getViewport({ scale: 1.0 }).width;
        const scaledViewport = page.getViewport({ scale });
        canvas.height = scaledViewport.height;
        canvas.width  = scaledViewport.width;
        await page.render({ canvasContext: context, viewport: scaledViewport }).promise;
    }

    // ── Filter click ──
    function onFilterClick(mode) {
        if (!fileInput.files.length) { alert(translations[currentLang].statusSelect); return; }
        if (!isVipActive() && fileInput.files.length > 1) { alert(translations[currentLang].statusVipOnly); return; }
        startConversionProcess(mode);
    }

    // ── VIP ──
    let adInterval;

    function handleVipClick() {
        if (isVipActive()) {
            alert(currentLang === 'tr' ? 'Zaten VIP modundasınız!' : 'You already have VIP!');
            return;
        }
        showAdModal();
    }

    function showAdModal() {
        const adModal  = document.getElementById('rewardAdModal');
        const timerEl  = document.getElementById('ad-timer');
        const closeBtn = document.getElementById('btn-close-ad');
        adModal.style.display = 'flex';
        closeBtn.style.display = 'none';
        let timeLeft = 3;
        timerEl.innerText  = timeLeft;
        timerEl.style.display = 'block';
        clearInterval(adInterval);
        adInterval = setInterval(() => {
            timeLeft--;
            timerEl.innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(adInterval);
                timerEl.style.display = 'none';
                closeBtn.style.display = 'block';
            }
        }, 1000);
    }

    function closeAdAndReward() {
        document.getElementById('rewardAdModal').style.display = 'none';
        localStorage.setItem('vipExpiry', new Date().getTime() + VIP_DURATION);
        checkVipStatus();
    }

    function isVipActive() {
        const vipExpiry = localStorage.getItem('vipExpiry');
        return vipExpiry ? new Date().getTime() < parseInt(vipExpiry) : false;
    }

    function checkVipStatus() {
        const t = translations[currentLang];
        const vipBtn = document.getElementById('vip-btn');
        const benefitsEl = document.getElementById('vip-benefits');
        if (isVipActive()) {
            vipBtn.classList.add('active');
            document.getElementById('txt-vip').innerText = t.vipActive;
            benefitsEl.classList.add('hidden');
            fileInput.setAttribute('multiple', 'multiple');
            document.getElementById('dropText').innerText = t.dropTextMulti;
        } else {
            vipBtn.classList.remove('active');
            document.getElementById('txt-vip').innerText = t.vipText;
            benefitsEl.classList.remove('hidden');
            benefitsEl.innerHTML = t.vipBenefits;
            fileInput.removeAttribute('multiple');
            document.getElementById('dropText').innerText = t.dropText;
        }
    }

    // ── Language ──
    function setLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('appLanguage', lang);
        document.getElementById('btn-tr').classList.toggle('active', lang === 'tr');
        document.getElementById('btn-en').classList.toggle('active', lang === 'en');
        const t = translations[lang];
        document.getElementById('txt-title').innerText    = t.title;
        document.getElementById('txt-subtitle').innerText = t.subtitle;
        document.getElementById('link-privacy').innerText = t.linkPrivacy;
        document.getElementById('link-terms').innerText   = t.linkTerms;
        document.getElementById('link-contact').innerText = t.linkContact;
        document.getElementById('txt-ad-title').innerText   = t.adTitle;
        document.getElementById('txt-ad-playing').innerText = t.adPlaying;
        document.getElementById('btn-close-ad').innerText   = t.adRewardBtn;
        document.getElementById('txt-filter-dark').innerText   = t.filterDark;
        document.getElementById('txt-filter-soft').innerText   = t.filterSoft;
        document.getElementById('txt-filter-sepia').innerText  = t.filterSepia;
        document.getElementById('txt-filter-dimmed').innerText = t.filterDimmed;
        checkVipStatus();
    }
</script>
